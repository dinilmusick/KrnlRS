name: Format Wave 2 Rust source
on:
  push:
    branches: [agent/wave2-krnlrs-complete-20261121]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit format changes (agent branch only, non-forced)
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          test "${GITHUB_REF_NAME}" = "agent/wave2-krnlrs-complete-20261121"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style: apply rustfmt for Wave 2'
          git push origin HEAD:refs/heads/agent/wave2-krnlrs-complete-20261121
