name: KrnlRS lifecycle portability
on:
  push:
    branches: [main, feat/rust-service-lifecycle]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    name: cargo test and clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Compile and run lifecycle tests
        run: cargo test --all-targets
      - name: Lint Rust service lifecycle
        run: cargo clippy --all-targets -- -D warnings
