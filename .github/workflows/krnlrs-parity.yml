name: KrnlRS parity verification
on:
  push:
    branches:
      - feat/krnlts-service-lifecycle-parity-20261119
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/krnlrs-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Verify lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Verify tests
        run: cargo test --all-targets --all-features
