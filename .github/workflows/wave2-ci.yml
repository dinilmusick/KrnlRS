name: KrnlRS Wave 2 full checks
on:
  push:
    branches: [agent/wave2-krnlrs-complete-20261121, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo formatting
        run: cargo fmt --all -- --check
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit, integration and golden tests
        run: cargo test --all-targets
      - name: Documentation tests
        run: cargo test --doc
      - name: Alloc-only portable compile
        run: cargo check --no-default-features --lib
      - name: Alloc-only external consumer
        run: cargo check --no-default-features --example portable_consumer
      - name: CLI valid and invalid manifest smoke
        run: |
          cargo run --bin krnl -- validate testdata/manifests/valid.krnl
          if cargo run --bin krnl -- validate testdata/manifests/invalid.krnl; then
            echo 'Expected invalid manifest to be rejected' >&2
            exit 1
          fi
      - name: External consumer example build and runtime
        run: |
          cargo check --example consumer
          cargo run --example consumer
      - name: Portable consumer runtime
        run: cargo run --no-default-features --example portable_consumer
