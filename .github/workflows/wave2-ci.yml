name: KrnlRS Wave 2 full checks
on:
  push:
    branches: [agent/wave2-krnlrs-complete-20261121, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cargo formatting
        run: cargo fmt --all -- --check
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit, integration and golden tests
        run: cargo test --all-targets
      - name: Documentation tests
        run: cargo test --doc
      - name: External consumer example
        run: cargo check --example consumer
